<div class="text-center" data-ng-if="$ctrl.loading">
    <oui-spinner data-size="s"></oui-spinner>
</div>

<!-- Hidden when the rule is not visible (SIREN absent from the directory) -->
<div data-ng-if="!$ctrl.loading && $ctrl.rule.visible">
    <!-- Empty: informational banner, nothing to select -->
    <oui-message type="info" data-ng-if="$ctrl.isEmpty()">
        <span
            data-ng-if="!$ctrl.isB2g()"
            data-translate="signup_einvoicing_empty_b2b"
            data-translate-values="{ siren: $ctrl.getSiren() }"
        ></span>
        <span
            data-ng-if="$ctrl.isB2g()"
            data-translate="signup_einvoicing_empty_b2g"
        ></span>
    </oui-message>

    <!-- Single address: informational banner, used automatically -->
    <oui-message type="info" data-ng-if="$ctrl.hasSingleAddress()">
        <span
            data-ng-if="!$ctrl.isB2g()"
            data-translate="signup_einvoicing_single_b2b"
            data-translate-values="{ address: $ctrl.getSingleAddress() }"
        ></span>
        <span
            data-ng-if="$ctrl.isB2g()"
            data-translate="signup_einvoicing_single_b2g"
            data-translate-values="{ address: $ctrl.getSingleAddress() }"
        ></span>
    </oui-message>

    <!-- Multiple addresses: mandatory select -->
    <div class="oui-field" data-ng-if="$ctrl.hasMultipleAddresses()">
        <div class="oui-field__header">
            <label
                class="oui-field__label"
                for="einvoicingBillingAddress"
                data-translate="signup_einvoicing_address_label"
            ></label>
        </div>
        <div class="oui-field__control">
            <label class="oui-select">
                <select
                    id="einvoicingBillingAddress"
                    name="einvoicingBillingAddress"
                    class="oui-select__input"
                    data-ng-model="$ctrl.model.einvoicingBillingAddress"
                    data-ng-options="address as address for address in $ctrl.rule.in"
                    data-ng-required="$ctrl.rule.mandatory"
                ></select>
                <span
                    class="oui-icon oui-icon-chevron-down bg-transparent"
                    aria-hidden="true"
                ></span>
            </label>
            <p
                class="mt-2"
                data-ng-if="$ctrl.isB2g()"
                data-translate="signup_einvoicing_multi_b2g_hint"
            ></p>
        </div>
    </div>

    <!-- RG6: selected address no longer active at save time -->
    <oui-message class="mt-3" type="warning" data-ng-if="$ctrl.staleAddress">
        <span data-translate="signup_einvoicing_stale_address"></span>
    </oui-message>
</div>
