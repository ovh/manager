<div class="modal d-block" role="dialog">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <!-- The close icon is the only way out without changes: no cancel
                 button, as dismissing IS cancelling. -->
            <oui-modal
                data-heading="{{:: $ctrl.getHeadingKey() | translate }}"
                data-on-dismiss="$ctrl.cancel()"
            >
                <div class="siret-search-modal__content">
                    <p data-translate="{{ $ctrl.getIntroKey() }}"></p>

                    <!-- search: the ui-kit field markup is reproduced by hand
                         because oui-field reads its error state from an ngModel
                         validator, and a validator here would propagate to the
                         surrounding form and lock its submit button. -->
                    <div
                        class="oui-field"
                        data-ng-class="{ 'oui-field_error': $ctrl.isSearchInvalid() }"
                    >
                        <div class="oui-field__header">
                            <label
                                class="oui-field__label"
                                for="siret-search-modal-input"
                                data-translate="siret_siret"
                            ></label>
                        </div>
                        <div class="oui-field__control d-flex mb-2">
                            <!-- No ngModel validators and no nested form on purpose:
                                 both would propagate to the form this modal is
                                 rendered in and disable its submit button. -->
                            <input
                                id="siret-search-modal-input"
                                class="mr-2 oui-input"
                                type="text"
                                placeholder="{{:: 'siret_modification_search_placeholder' | translate }}"
                                data-ng-model="$ctrl.search"
                                data-ng-change="$ctrl.onSearchChange()"
                                data-ng-keydown="$ctrl.onSearchKeyDown($event)"
                                data-ng-blur="$ctrl.onSearchBlur()"
                            />
                            <button
                                type="button"
                                class="oui-button oui-button_primary"
                                data-ng-disabled="!$ctrl.canSearch()"
                                data-ng-click="$ctrl.submitSearch()"
                            >
                                <span
                                    data-translate="{{ $ctrl.getSearchButtonLabelKey() }}"
                                ></span>
                            </button>
                        </div>
                        <div class="oui-field__footer">
                            <div
                                class="oui-field__error"
                                data-ng-if="$ctrl.isSearchInvalid()"
                            >
                                <span
                                    role="alert"
                                    data-translate="siret_modal_search_invalid"
                                ></span>
                            </div>
                        </div>
                    </div>
                    <!-- end search -->

                    <div class="text-center mb-2" data-ng-if="$ctrl.searching">
                        <oui-spinner></oui-spinner>
                    </div>

                    <div data-ng-if="$ctrl.hasSearched()">
                        <oui-message
                            data-type="error"
                            data-ng-if="$ctrl.hasError()"
                        >
                            <span
                                data-translate="siret_suggest_error"
                                data-translate-values="{ message: $ctrl.suggest.message }"
                            ></span>
                        </oui-message>

                        <oui-message
                            data-type="warning"
                            data-ng-if="$ctrl.hasNoResult()"
                        >
                            <span
                                data-translate="siret_suggest_no_result"
                                data-translate-values="{ search: $ctrl.suggest.searched }"
                            ></span>
                        </oui-message>

                        <!-- more than one establishment: let the customer pick -->
                        <div data-ng-if="$ctrl.hasManyEntries()">
                            <p data-translate="siret_suggest_select_company"></p>
                            <oui-field>
                                <oui-select-picker
                                    data-ng-repeat="entry in $ctrl.suggest.entryList"
                                    data-name="siretModalPicker"
                                    data-label="{{ entry.name }}"
                                    data-on-change="$ctrl.selectSuggest(modelValue)"
                                    data-model="$ctrl.selected"
                                    data-values="[entry]"
                                >
                                    <oui-select-picker-section>
                                        <p
                                            class="mb-0"
                                            data-ng-bind="entry.address + ' ' + entry.zipCode + ' ' + entry.city"
                                        ></p>
                                        <p
                                            class="mb-0"
                                            data-ng-bind="('siret_suggest_siret' | translate) + ' ' + entry.secondaryCNIN"
                                        ></p>
                                    </oui-select-picker-section>
                                </oui-select-picker>
                            </oui-field>
                        </div>

                        <!-- company found: review before committing -->
                        <div class="mt-3" data-ng-if="$ctrl.selected">
                            <!-- The review paragraphs below show '-' for every
                                 withheld value: explain them before they are
                                 read, and name what has to be completed. -->
                            <oui-message
                                data-type="info"
                                data-ng-if="$ctrl.isNonDiffusible()"
                            >
                                <p
                                    class="mb-1"
                                    data-translate="siret_modal_non_diffusible_intro"
                                ></p>
                                <ul class="mb-0">
                                    <li
                                        data-ng-repeat="labelKey in $ctrl.getMissingFieldLabelKeys()"
                                        data-translate="{{ labelKey }}"
                                    ></li>
                                </ul>
                            </oui-message>

                            <p
                                class="mb-0"
                                data-ng-bind="$ctrl.getCompanyName() || '-'"
                            ></p>
                            <p
                                class="mb-0"
                                data-ng-bind="$ctrl.getCompanyAddress() || '-'"
                            ></p>
                            <p
                                class="mb-0"
                                data-ng-bind="('siret_suggest_siren' | translate) + ' ' + $ctrl.selected.primaryCNIN"
                            ></p>
                            <p
                                class="mb-0"
                                data-ng-bind="('siret_suggest_siret' | translate) + ' ' + $ctrl.selected.secondaryCNIN"
                            ></p>
                        </div>
                    </div>

                    <!-- Hand-rolled footer: oui-modal renders its primary action
                         as a type=submit button, which would submit the form this
                         modal is rendered in. -->
                    <div class="d-flex justify-content-end mt-4">
                        <button
                            type="button"
                            class="oui-button oui-button_l oui-button_primary"
                            data-ng-disabled="!$ctrl.selected"
                            data-ng-click="$ctrl.validate()"
                        >
                            <span
                                data-translate="{{ $ctrl.getValidateLabelKey() }}"
                            ></span>
                        </button>
                    </div>
                </div>
            </oui-modal>
        </div>
    </div>
</div>
<div class="oui-modal-backdrop"></div>
